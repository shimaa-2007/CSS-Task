<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/contact.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Navbar -->
    <header id="navbar">
      <div class="container">
        <nav>
          <a href="index.html"
            ><img src="assets/images/logo.png" alt="Logo" class="logo"
          /></a>
          <div class="nav-links">
            <a href="index.html" target="_blank">Back to Home</a>
          </div>
        </nav>
      </div>
    </header>

    <!-- Contact Section -->
    <section class="contact-section">
      <div class="container">
        <div class="contact-wrapper">
          <!-- Contact Form -->
          <form action="#" method="POST" class="contact-form">
            <div class="form-row">
              <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required />
              </div>
              <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required />
              </div>
            </div>

            <div class="form-group full-width">
              <label for="phone">Phone</label>
              <input type="tel" id="phone" name="phone"/>
            </div>

            <div class="form-group full-width">
              <label for="message">Your Message</label>
              <textarea
                id="message"
                name="message"
                rows="6"
                required
              ></textarea>
            </div>

            <div class="form-btn">
              <button type="submit" class="btn btn-primary">
                Send Message
              </button>
            </div>
          </form>

          <!-- Google Map -->
          <div class="map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1108.2926051305426!2d31.211382564007597!3d30.031244004742533!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x145846d0b807627d%3A0xb2a6ce4702edc3da!2z2YPZhNmK2Kkg2KfZhNit2KfYs9io2KfYqiDZiNin2YTYsNmD2KfYoSDYp9mE2KfYtdi32YbYp9i52Ykg2KzYp9mF2LnYqSDYp9mE2YLYp9mH2LHYqQ!5e0!3m2!1sar!2seg!4v1788142541044!5m2!1sar!2seg" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>"
        
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
